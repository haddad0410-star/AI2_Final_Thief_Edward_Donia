[project]
name = "thief_peer"
version = "0.1.0"
description = "Thief peer for the Distributed Cops-and-Robbers P2P final project"
readme = "README.md"
authors = [
    { name = "Edward Haddad", email = "haddad0410@gmail.com" },
    { name = "Donia Naser" },
]
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=3.4.3",
]

[project.optional-dependencies]
# Only needed for real Gmail --send mode (Manual Gate C, never exercised by
# default `uv sync` or by the test suite, which always injects a mocked
# Gmail client). Install explicitly with `uv sync --extra gmail-send`
# before ever using `peer report --send`.
gmail-send = [
    "google-auth>=2.29",
    "google-auth-oauthlib>=1.2",
    "google-api-python-client>=2.130",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["slow: long-running integration tests (real MCP servers)"]

[tool.coverage.run]
source = ["src"]
omit = [
    "*/__main__.py",
    "*/gui/*",
]

[tool.coverage.report]
fail_under = 85
show_missing = true
