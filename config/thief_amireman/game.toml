# THIEF peer configuration -- PRIVATE, LOCAL setup only for this peer.
# Anything the two sides must AGREE on (board, movement, scoring, pheromones,
# network/league minimums, rate limits) lives in the signed, shared game.json in this
# same directory -- never here. This file must contain nothing relevant to the
# opponent beyond the one URL needed to reach them.
#
# Read by thief_peer.shared.config_loader at startup.

version = "0.1.0"

[game]
group_name = "Edward-Donia"
group_id = "ed%do111"          # OFFICIAL course-assigned group id (course-confirmed)
sub_game_number = 1
members = ["Edward Haddad 214083115", "Donia Naser 212810493"]
repos = { police = "https://github.com/haddad0410-star/AI2_Final_Police_Edward_Donia", thief = "https://github.com/haddad0410-star/AI2_Final_Thief_Edward_Donia" }

[network]
my_port = 8902                                    # MY MCP server port (private choice)
opponent_url = "https://mineral-downloadable-luis-thereof.trycloudflare.com/mcp"   # amireman's stated public MCP URL, 2026-08-17
turn_timeout_seconds = 180

# [strategy] -- optional: point at YOUR own brain subclass (else BaselineThiefBrain
# runs). Left unset here by default; the advanced EntropyEscapeThiefBrain (implemented,
# see src/thief_peer/strategy/) is used instead in config/thief_advanced/game.toml.
# thief_class = "thief_peer.strategy.entropy_escape_thief_brain:EntropyEscapeThiefBrain"

# [trash_talk] -- HOW the banter/hint is produced. The MOVE is always pure Python.
[trash_talk]
provider = "template"        # 0 tokens, no network, no paid API -- DEFAULT, do not change without explicit opt-in
# model / every_n_steps are only relevant if a paid provider is opted into later

[gui]
cell_px = 52

[paths]
logs_dir = "logs"
log_filename = "{role}_match.json"

[play]
seed = 5678                  # MY private RNG seed (local move/banter randomness); never shared

[email]
recipient = "rmisegal+uoh26finalgame@gmail.com"
mode = "disabled"            # disabled by default -- no Gmail call of any kind until Manual Gate C is cleared
credentials_dir_env_var = "GMAIL_CREDENTIALS_DIR"   # points OUTSIDE this repo; see .env-example
